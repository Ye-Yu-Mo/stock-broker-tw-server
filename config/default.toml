# Default configuration for the broker server.
# Values here can be overridden by environment variables (YUANTA_*) or .env.

[server]
host = "127.0.0.1"
port = 8000
# Leave empty to disable bearer-token authentication during local development.
api_token = ""
log_level = "INFO"
log_json = true

[yuanta]
environment = "UAT"
spark_api_dir = "vendor/yuanta/sparkapi"
login_timeout = 15.0
log_type = "COMMON"
pmm_server_check = false

[account]
account = "S98875005091"
password = "1234"
# pfx_path = "/absolute/path/to/your.pfx"   # macOS/Linux login requires this
# pfx_pass = "yuanta"

[audit]
enabled = true
# file = "state/audit.jsonl"   # optional JSON-lines audit file

[state]
db_path = "state/yuanta.db"

[query]
timeout = 10.0
rate_limit_per_second = 3
rate_limit_per_minute = 600

[rate_limit]
query_per_second = 3
query_per_minute = 600
quote_per_second = 10
trade_per_second = 10
trade_max_batch = 30

[notify]
enabled = false
webhook_url = ""
webhook_type = "generic"
# 飞书机器人开启签名校验时填写
secret = ""
timeout = 3.0
risk_rejection_dedupe_seconds = 60.0

# 可配置的报警事件：enabled 控制是否推送，title 覆盖默认标题，template 支持 {字段名} 占位。
[notify.events]
"risk.rejected" = { enabled = true, title = "风控拒绝", template = "[风控拒绝] {client_order_id} {action} {code} {message}" }
"order.status" = { enabled = true, title = "订单状态变化", template = "[订单状态变化] {client_order_id} -> {status} {order_no}" }
"order.broker_error" = { enabled = true, title = "委托发送异常", template = "[委托异常] {client_order_id} {error}" }
"risk.panic" = { enabled = true, title = "Panic 变化", template = "[Panic] old={old} new={panic}" }
"circuit.opened" = { enabled = true, title = "熔断开启", template = "[熔断开启] {name} {error}" }
"circuit.closed" = { enabled = true, title = "熔断恢复", template = "[熔断恢复] {name}" }
"recovery.error" = { enabled = true, title = "启动恢复异常", template = "[恢复异常] {error}" }

[risk]
panic = false
max_order_qty = 100000
max_order_amount = 100000000.0
max_price_deviation_pct = 10.0
# reference_price = 100.0
# blacklist = ["2330", "0050"]
order_timeout = 10.0
circuit_failure_threshold = 5
circuit_cooldown_seconds = 30.0
