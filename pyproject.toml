[project]
name = "stock-broker-tw-server"
version = "0.1.0"
description = "Yuanta Spark API broker server for Taiwan domestic stocks (single account)"
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
    { name = "Ye-Yu-Mo" },
]
keywords = [
    "yuanta",
    "spark-api",
    "broker",
    "taiwan-stock",
    "twse",
    "trading",
    "fastapi",
    "quant",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Natural Language :: Chinese (Traditional)",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pythonnet>=3.0",
    "prometheus-client>=0.20",
]

[project.urls]
Homepage = "https://github.com/Ye-Yu-Mo/stock-broker-tw-server"
Repository = "https://github.com/Ye-Yu-Mo/stock-broker-tw-server"
Documentation = "https://github.com/Ye-Yu-Mo/stock-broker-tw-server/blob/main/README.md"

[project.scripts]
stock-broker-tw = "stock_broker_tw.main:run"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/stock_broker_tw"]

[tool.uv]
package = true

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["vendor", "docs", "target", ".venv"]

[tool.ruff.lint]
# This project intentionally catches broad .NET/pythonnet interop exceptions
# and uses Optional[...] for pythonnet compatibility clarity.
extend-ignore = [
    "BLE001",
    "EXE001",
    "PYI034",
    "RUF100",
    "S110",
    "S112",
    "SIM103",
    "UP045",
]
